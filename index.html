<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrovoyage – Walk on Other Worlds</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#04060b;--glass:rgba(12,16,26,.72);--line:rgba(190,210,255,.14);--txt:#eaf0ff;--mut:#8c98b8;--acc:#ffb347;--cy:#62e3ff;--bad:#ff5d62;--ok:#4ade80}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--txt);font:14px/1.55 'Instrument Sans',system-ui,sans-serif;overflow:hidden;color-scheme:dark}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
h1,h2,h4,.d,.big,b{font-family:'Space Grotesk',system-ui,sans-serif}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);border-radius:16px}
#brand{position:fixed;left:24px;top:20px;z-index:5;font:700 20px 'Space Grotesk';letter-spacing:.01em}#brand span{color:var(--acc)}
#rail{position:fixed;left:24px;top:68px;z-index:5;width:210px;padding:8px}
.it{display:flex;align-items:center;gap:12px;width:100%;padding:9px 12px;border:0;border-radius:10px;background:none;color:var(--txt);font:500 14px 'Space Grotesk';cursor:pointer;text-align:left}
.it i{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:inset -3px -3px 5px rgba(0,0,0,.45)}
.it:hover,.it:focus-visible{background:rgba(255,255,255,.07);outline:none}.it.on{background:rgba(255,179,71,.14);color:var(--acc)}
#tools{position:fixed;right:24px;top:20px;z-index:5;display:flex;gap:8px}
.pill{background:var(--glass);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 16px;font:500 13px 'Instrument Sans';cursor:pointer;backdrop-filter:blur(14px)}
.pill:hover,.pill:focus-visible{border-color:var(--cy);outline:none}.pill.on{border-color:var(--acc);color:var(--acc)}
#hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:4;color:var(--mut);padding:9px 18px;border-radius:99px;font-size:13px;pointer-events:none}
.lbl{position:fixed;left:0;top:0;z-index:3;font:500 12px 'Space Grotesk';color:var(--txt);padding:2px 10px;border-radius:99px;cursor:pointer;white-space:nowrap;background:rgba(4,6,11,.5);border:1px solid var(--line)}
.lbl:hover,.lbl.on{border-color:var(--acc);color:var(--acc)}
#panel{position:fixed;right:24px;top:68px;bottom:24px;width:400px;z-index:6;padding:22px;display:flex;flex-direction:column;transform:translateX(130%);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none}
.ph h2{margin:0;font-size:34px;line-height:1.05;letter-spacing:-.01em}.ph p{margin:6px 0 14px;color:var(--mut)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;color:var(--mut);padding:9px 2px;font:500 13px 'Space Grotesk';cursor:pointer}
.tabs button.on{color:var(--txt);border-color:var(--acc)}.tabs button:focus-visible{outline:1px solid var(--cy)}
.tb{flex:1;overflow:auto;padding-right:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:rgba(255,255,255,.035)}
.st small{display:block;color:var(--mut);font-size:12px}.st b{display:block;font-size:16px;margin-top:2px;line-height:1.25}
.verd{border-radius:14px;padding:16px;margin-bottom:14px;border:1px solid}
.verd.bad{border-color:rgba(255,93,98,.45);background:rgba(255,93,98,.08)}.verd.ok{border-color:rgba(74,222,128,.45);background:rgba(74,222,128,.08)}
.verd .big{font-size:34px;font-weight:700;line-height:1.1;margin:2px 0 6px}.bad .big{color:var(--bad)}.ok .big{color:var(--ok)}.verd p{margin:0}
h4{margin:16px 0 8px;font-size:14px}ul{margin:0;padding-left:18px}li{margin-bottom:5px}
.meter{display:flex;gap:5px;margin:4px 0 12px}.meter i{flex:1;height:8px;border-radius:9px;background:rgba(255,255,255,.12)}.meter i.f{background:var(--ok)}
.btn{margin-top:14px;width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--acc);color:#1a1000;font:700 15px 'Space Grotesk';cursor:pointer}
.btn:hover,.btn:focus-visible{filter:brightness(1.1);outline:none}
#hud{position:fixed;left:24px;top:68px;z-index:6;padding:16px 18px;width:250px;display:none}
#hud h3{margin:0 0 8px;font:700 18px 'Space Grotesk'}#hud div{display:flex;justify-content:space-between;padding:3px 0;color:var(--mut)}#hud div b{color:var(--txt);font-size:13px}
#vit{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:6;width:420px;padding:14px 18px;display:none;text-align:center}
.bar{height:8px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok);width:100%}
#vit .pill{margin-top:4px}
#vig{position:fixed;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 25%,rgba(120,0,0,.9) 100%)}
#visor{position:fixed;inset:0;z-index:4;pointer-events:none;display:none;box-shadow:inset 0 0 140px 30px rgba(0,0,0,.55)}
#fade{position:fixed;inset:0;background:#000;z-index:20;opacity:0;pointer-events:none;transition:opacity .7s}
#dead{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.88);text-align:center}
#dead div{max-width:480px}#dead h2{font-size:42px;color:var(--bad);margin:0 0 10px}
#small{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);align-items:center;justify-content:center;text-align:center;padding:30px}
@media(max-width:1000px){#small{display:flex}}
@media(prefers-reduced-motion:reduce){#panel,#fade{transition:none}}

const stars=(()=>{const a=[];for(let i=0;i<3000;i++){const u=Math.random()*2-1,t=Math.random()*6.2832,q=Math.sqrt(1-u*u),m=1000+Math.random()*600;a.push(q*Math.cos(t)*m,u*m,q*Math.sin(t)*m)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(a,3));const s=new THREE.Points(g,new THREE.PointsMaterial({size:1.7,color:0xd8e2ff,sizeAttenuation:false,fog:false}));s.renderOrder=-1;scene.add(s);return s})();

/* ============ SURFACE WORLD ============ */
let env,H,dome,sunSpr,dust,dpos,dirL,hemi,pl={x:0,y:0,z:0,vy:0},ocean;
function buildSurface(p){env=p.env;while(surf.children.length)surf.remove(surf.children[0]);const A=env.amp,deck=!!env.deck;
 H=(x,z)=>deck?(fbm(x*.01,z*.01,3)-.4)*A:(fbm(x*.008,z*.008,4)-.42)*A*1.6+fbm(x*.07,z*.07,2)*A*.12;
 const S=900,N=220,geo=new THREE.PlaneGeometry(S,S,N,N);geo.rotateX(-Math.PI/2);const ps=geo.attributes.position,col=[],c1=new THREE.Color(env.g1),c2=new THREE.Color(env.g2),cc=new THREE.Color();
 for(let i=0;i<ps.count;i++){const x=ps.getX(i),z=ps.getZ(i),h=H(x,z);ps.setY(i,h);cc.copy(c1).lerp(c2,Math.max(0,Math.min(1,fbm(x*.03,z*.03,3)*1.3+h/(A*3)-.1)));col.push(cc.r,cc.g,cc.b)}
 geo.setAttribute('color',new THREE.Float32BufferAttribute(col,3));geo.computeVertexNormals();
 surf.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({vertexColors:true,roughness:1,flatShading:!deck&&!env.ocean})));
 dirL=new THREE.DirectionalLight(0xffffff,env.si);dirL.position.set(-.5,.3,-.8).multiplyScalar(100);hemi=new THREE.HemisphereLight(new THREE.Color(env.top),new THREE.Color(env.g1),env.sun>1?.12:.55);surf.add(dirL,hemi);
 dome=new THREE.Mesh(new THREE.SphereGeometry(1500,32,16),new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,fog:false,uniforms:{top:{value:new THREE.Color(env.top)},hor:{value:new THREE.Color(env.hor)}},
  vertexShader:'varying vec3 p;void main(){p=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'varying vec3 p;uniform vec3 top,hor;void main(){float h=clamp(p.y*1.8,0.,1.);gl_FragColor=vec4(mix(hor,top,pow(h,.55)),1.);}'}));dome.renderOrder=-3;surf.add(dome);
 sunSpr=new THREE.Group();if(env.sun>0){const g1=glow('rgba(255,250,235,1)',90*env.sun),g2=glow('rgba(255,230,180,.35)',420*Math.sqrt(env.sun));sunSpr.add(g1,g2)}surf.add(sunSpr);
 if(env.ocean){ocean=new THREE.Mesh(new THREE.PlaneGeometry(S,S),new THREE.MeshStandardMaterial({color:0x1f5fae,transparent:true,opacity:.82,roughness:.15,metalness:.5}));ocean.rotation.x=-Math.PI/2;ocean.position.y=0;surf.add(ocean)}
 if(env.trees){const tg=new THREE.ConeGeometry(2,7,6),tm=new THREE.MeshStandardMaterial({color:0x2d5a2a,flatShading:true});for(let i=0;i<260;i++){const x=(Math.random()-.5)*600,z=(Math.random()-.5)*600,h=H(x,z);if(h>2&&h<A*.6){const t=new THREE.Mesh(tg,tm);t.position.set(x,h+3.2,z);t.scale.setScalar(.7+Math.random());surf.add(t)}}}
 if(!deck){const rg=new THREE.DodecahedronGeometry(1),rmat=new THREE.MeshStandardMaterial({color:env.g1,flatShading:true,roughness:1});for(let i=0;i<150;i++){const x=(Math.random()-.5)*500,z=(Math.random()-.5)*500,h=H(x,z);if(h<0&&env.ocean)continue;const r=new THREE.Mesh(rg,rmat);r.scale.set(.4+Math.random()*2,.3+Math.random()*1.4,.4+Math.random()*2);r.position.set(x,h+.2,z);r.rotation.set(Math.random(),Math.random(),Math.random());surf.add(r)}}
 if(env.dust){const n=900;dpos=new Float32Array(n*3);for(let i=0;i<n*3;i++)dpos[i]=(Math.random()-.5)*80;const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(dpos,3));dust=new THREE.Points(g,new THREE.PointsMaterial({size:env.deck?2.4:1.6,color:new THREE.Color(env.dc),transparent:true,opacity:.55,sizeAttenuation:false,fog:false,depthWrite:false}));dust.frustumCulled=false;surf.add(dust)}else dust=null;
 let sx=0,sz=0;if(env.ocean){for(let r=0;r<400;r+=8){let ok=0;for(let a=0;a<6.28;a+=.4){const x=Math.cos(a)*r,z=Math.sin(a)*r;if(H(x,z)>4){sx=x;sz=z;ok=1;break}}if(ok)break}}
 pl.x=sx;pl.z=sz;pl.y=H(sx,sz)+1.7;pl.vy=0;scene.fog=new THREE.FogExp2(new THREE.Color(env.hor),env.fd||.00005)}

/* ============ STATE + CONTROLS ============ */
const st={mode:'sys',sel:-1,th:.6,ph:1.05,r:170,tgt:new THREE.Vector3(),gth:.6,gph:1.05,gr:170,gt:new THREE.Vector3(),yaw:0,pit:0};
let drag=null,moved=0,pause=false,suit=true,left=0,dead=false,jumpReq=false;const K={};
const $=id=>document.getElementById(id),panel=$('panel'),rail=$('rail'),back=$('back'),hint=$('hint'),hud=$('hud'),vit=$('vit'),vig=$('vig'),visor=$('visor'),fade=$('fade');
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}addEventListener('resize',resize);resize();
cv.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};moved=0;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};moved+=Math.abs(dx)+Math.abs(dy);
 if(st.mode=='surf'){st.yaw+=dx*.004;st.pit=Math.max(-1.3,Math.min(1.3,st.pit-dy*.004))}else{st.gth-=dx*.006;st.gph=Math.max(.15,Math.min(2.9,st.gph-dy*.006))}});
cv.addEventListener('pointerup',e=>{if(moved<6&&st.mode!='surf')pick(e);drag=null});
cv.addEventListener('wheel',e=>{e.preventDefault();if(st.mode=='surf')return;const f=st.mode=='sys'?[25,330]:[P[st.sel].r*1.8,P[st.sel].r*16];st.gr=Math.max(f[0],Math.min(f[1],st.gr*(1+e.deltaY*.0012)))},{passive:false});
addEventListener('keydown',e=>{K[e.code]=1;if(e.code=='Space'&&st.mode=='surf'){jumpReq=true;e.preventDefault()}if(e.code=='Escape')back.click()});addEventListener('keyup',e=>K[e.code]=0);
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function pick(e){mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(P.map(p=>p.m),false)[0];if(h)select(h.object.userData.i)}
P.forEach((p,i)=>{const b=document.createElement('button');b.className='it';b.innerHTML='<i style="background:radial-gradient(circle at 35% 30%,'+p.c[2]+','+p.c[1]+' 60%,'+p.c[0]+')"></i>'+p.n;b.onclick=()=>select(i);rail.appendChild(b);p.b=b;
 const l=document.createElement('div');l.className='lbl';l.textContent=p.n;l.onclick=()=>select(i);document.body.appendChild(l);p.l=l});
function mark(i){P.forEach((p,k)=>{p.b.classList.toggle('on',k==i);p.l.classList.toggle('on',k==i)})}
$('tOrb').onclick=e=>{e.target.classList.toggle('on');const v=e.target.classList.contains('on');orbits.forEach(o=>o.visible=v)};
$('tPause').onclick=e=>{pause=!pause;e.target.classList.toggle('on',pause);e.target.textContent=pause?'Resume orbits':'Pause orbits'};

/* ============ PANEL ============ */
function select(i){st.mode='focus';st.sel=i;mark(i);const p=P[i];st.gr=p.r*4.6;st.gph=1.3;back.style.display='';back.textContent='All planets';hint.textContent='Drag to orbit '+p.n+' · scroll to zoom';ui(p)}
function ui(p){panel.innerHTML='<div class="ph"><h2>'+p.n+'</h2><p>'+p.tag+'</p></div><div class="tabs">'+['Overview','Survival','You’d see','Life'].map((t,i)=>'<button data-i="'+i+'" class="'+(i?'':'on')+'">'+t+'</button>').join('')+'</div><div class="tb" id="tb"></div><button class="btn" id="enter">'+(p.env.deck?'Descend into '+p.n+'’s clouds':'Land on '+p.n)+'</button>';
 const tb=$('tb'),safe=p.tt===null;
 const tabs=[()=>'<div class="grid">'+[['Temperature',p.t],['Gravity',p.gr],['Atmosphere',p.a],['Water availability',p.w],['Radiation risk',p.rad],['Pressure',p.p]].map(x=>'<div class="st"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div>',
 ()=>'<div class="verd '+(safe?'ok':'bad')+'"><small>Without special equipment</small><div class="big">'+(safe?'You can survive':'≈ '+p.tt+' seconds')+'</div><p>'+p.v+'</p></div><h4>Equipment you would need</h4><ul>'+p.eq.map(x=>'<li>'+x+'</li>').join('')+'</ul><div class="st" style="margin-top:12px"><small>Survival time with equipment</small><b>'+p.gt+'</b></div>',
 ()=>'<h4 style="margin-top:0">If you stood here</h4><p>'+p.see+'</p><p style="color:var(--mut)">Press the button below to actually stand there: walk, jump and look around.</p>',
 ()=>'<h4 style="margin-top:0">Could life exist? '+p.life[1]+'</h4><div class="meter">'+[1,2,3,4,5].map(n=>'<i class="'+(n<=p.life[0]?'f':'')+'"></i>').join('')+'</div><p>'+p.life[2]+'</p>'];
 const show=i=>{tb.innerHTML=tabs[i]();panel.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.i==i))};show(0);
 panel.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(+b.dataset.i));$('enter').onclick=()=>land(st.sel);panel.classList.add('open')}

/* ============ LAND / LEAVE ============ */
function land(i){const p=P[i];fade.style.opacity=1;setTimeout(()=>{buildSurface(p);st.mode='surf';sys.visible=false;stars.visible=!!env.stars;sunL.visible=false;amb.intensity=.04;surf.visible=true;scene.background=null;
  panel.classList.remove('open');rail.style.display='none';P.forEach(q=>q.l.style.display='none');$('tOrb').style.display=$('tPause').style.display='none';back.textContent='Leave '+p.n+' (Esc)';
  hint.textContent='W A S D to walk · Shift to run · Space to jump · drag to look around';st.yaw=0;st.pit=0;suit=p.tt!==null;left=p.tt||0;dead=false;$('dead').style.display='none';
  hud.innerHTML='<h3>'+p.n+'</h3><div>Temperature<b>'+p.t.split(',')[0].split(' average')[0]+'</b></div><div>Gravity<b>'+p.gr+'</b></div><div>Pressure<b>'+p.p.split(' (')[0]+'</b></div><div>Air<b>'+p.a.split(',')[0]+'</b></div><div>Radiation<b>'+p.rad.split(',')[0]+'</b></div>';hud.style.display='block';vitals();fade.style.opacity=0},750)}
function vitals(){const p=P[st.sel];if(p.tt===null){vit.style.display='block';vit.innerHTML='<b>You are safe here</b><div style="color:var(--mut)">Breathable air and a mild climate. No equipment needed.</div>';visor.style.display='none';return}
 vit.style.display='block';visor.style.display=suit?'block':'none';
 vit.innerHTML='<b>'+(suit?'Protection ON: you are safe':'No protection: exposure clock running')+'</b><div class="bar"><i id="vb" style="background:'+(suit?'var(--ok)':'var(--bad)')+'"></i></div><button class="pill" id="sw">'+(suit?'Remove protection and see what happens':'Put protection back on')+'</button>';
 $('sw').onclick=()=>{suit=!suit;if(suit){left=p.tt;vig.style.opacity=0}vitals()}}
$('rs').onclick=()=>{dead=false;suit=true;left=P[st.sel].tt;$('dead').style.display='none';vig.style.opacity=0;vitals()};
back.onclick=()=>{if(st.mode=='surf'){fade.style.opacity=1;setTimeout(()=>{st.mode='focus';surf.visible=false;sys.visible=true;stars.visible=true;stars.position.set(0,0,0);sunL.visible=true;amb.intensity=.32;scene.fog=null;hud.style.display=vit.style.display=visor.style.display='none';vig.style.opacity=0;$('dead').style.display='none';
  rail.style.display='';P.forEach(q=>q.l.style.display='');$('tOrb').style.display=$('tPause').style.display='';back.textContent='All planets';hint.textContent='Drag to orbit · scroll to zoom';panel.classList.add('open');fade.style.opacity=0},700);return}
 if(st.mode=='focus'){st.mode='sys';st.sel=-1;st.gt.set(0,0,0);st.gr=170;st.gph=1.05;panel.classList.remove('open');back.style.display='none';mark(-1);hint.textContent='Drag to rotate · scroll to zoom · click a planet to fly there'}};

/* ============ LOOP ============ */
const clk=new THREE.Clock(),v3=new THREE.Vector3();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),T=clk.elapsedTime;
 if(st.mode!='surf'){
  P.forEach(p=>{if(!pause&&!rm)p.a0+=p.s*dt*.1;p.m.position.set(Math.cos(p.a0)*p.d,0,Math.sin(p.a0)*p.d);p.m.rotation.y+=dt*.25});sun.rotation.y+=dt*.04;
  if(st.mode=='focus')st.gt.copy(P[st.sel].m.position);
  const k=1-Math.pow(.003,dt);st.th+=(st.gth-st.th)*k;st.ph+=(st.gph-st.ph)*k;st.r+=(st.gr-st.r)*k;st.tgt.lerp(st.gt,k);if(st.mode=='sys'&&!drag&&!rm)st.gth+=dt*.015;
  cam.position.set(st.tgt.x+st.r*Math.sin(st.ph)*Math.cos(st.th),st.tgt.y+st.r*Math.cos(st.ph),st.tgt.z+st.r*Math.sin(st.ph)*Math.sin(st.th));cam.lookAt(st.tgt);
  P.forEach(p=>{v3.copy(p.m.position);v3.project(cam);p.l.style.visibility=v3.z<1?'visible':'hidden';p.l.style.transform='translate('+((v3.x*.5+.5)*innerWidth)+'px,'+((-v3.y*.5+.5)*innerHeight+p.r*(st.mode=='sys'?4:12)+14)+'px) translate(-50%,0)'})}
 else{const p=P[st.sel];
  if(!dead){const sp=(K.ShiftLeft?9:4)*(p.env.deck?.6:1),fx=Math.sin(st.yaw),fz=-Math.cos(st.yaw);let mx=0,mz=0;
   if(K.KeyW||K.ArrowUp){mx+=fx;mz+=fz}if(K.KeyS||K.ArrowDown){mx-=fx;mz-=fz}if(K.KeyA||K.ArrowLeft){mx+=fz;mz-=fx}if(K.KeyD||K.ArrowRight){mx-=fz;mz+=fx}
   pl.x=Math.max(-380,Math.min(380,pl.x+mx*sp*dt));pl.z=Math.max(-380,Math.min(380,pl.z+mz*sp*dt))}
  const gy=H(pl.x,pl.z)+1.7,g=env.g*9.81;if(jumpReq&&pl.y<=gy+.05&&!dead)pl.vy=4.6;jumpReq=false;pl.vy-=g*dt;pl.y+=pl.vy*dt;if(pl.y<gy){pl.y=gy;pl.vy=0}
  cam.position.set(pl.x,pl.y,pl.z);cam.lookAt(pl.x+Math.sin(st.yaw)*Math.cos(st.pit)*10,pl.y+Math.sin(st.pit)*10,pl.z-Math.cos(st.yaw)*Math.cos(st.pit)*10);
  dome.position.copy(cam.position);stars.position.copy(cam.position);sunSpr.position.set(cam.position.x-500,cam.position.y+260,cam.position.z-800);
  if(dust){const w=env.wind||[1.5,0,.5];for(let i=0;i<dpos.length;i+=3){dpos[i]+=w[0]*dt;dpos[i+2]+=w[2]*dt;dpos[i+1]+=Math.sin(T+i)*.02;for(let a=0;a<3;a+=3){}
    const ax=[cam.position.x,cam.position.y,cam.position.z];for(let a=0;a<3;a++){const d=dpos[i+a]-ax[a];if(d>40)dpos[i+a]-=80;else if(d<-40)dpos[i+a]+=80}}dust.geometry.attributes.position.needsUpdate=true}
  if(env.flash){const f=Math.random()<.004?1:0;if(f)hemi.intensity=3.2;else hemi.intensity+=((env.sun>1?.12:.55)-hemi.intensity)*.15}
  if(p.tt!==null&&!suit&&!dead){left-=dt;const r=Math.max(0,left/p.tt),vb=$('vb');if(vb)vb.style.width=(r*100)+'%';vig.style.opacity=Math.pow(1-r,1.6);
   if(left<=0){dead=true;$('dm').textContent=p.v;$('dead').style.display='flex'}}
  else{const vb=$('vb');if(vb&&suit)vb.style.width='100%'}}
 R.render(scene,cam)}
loop();
</script></body></html>
